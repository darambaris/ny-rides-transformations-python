[project]
name = "ny-rides-transformations-python"
version = "0.1.0"
description = "Data quality-first pipeline for NYC Taxi trips featuring PySpark, dbt, data contracts, automated testing, lineage-aware validation, and AI-driven reliability insights."
authors = [
    {name = "Jessika Darambaris",email = "jessika.darambaris@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyspark (>=4.1.2,<5.0.0)",
    "duckdb (>=1.5.3,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.1.0,<10.0.0)",
    "ruff (>=0.15.17,<0.16.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]

[tool.poetry]
packages = [
    { include = "ny_rides" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

